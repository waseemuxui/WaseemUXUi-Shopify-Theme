<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waseem UXUi 2.0 License Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white shadow-xl rounded-xl p-8 max-w-md w-full">
    <h1 class="text-2xl font-bold mb-6 text-center text-indigo-600">Waseem UXUi 2.0 License Generator</h1>
    
    <form id="licenseForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Full Name</label>
        <input type="text" id="name" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:border-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Email Address</label>
        <input type="email" id="email" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring focus:border-indigo-500" />
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 rounded-lg hover:bg-indigo-700 transition">Generate License</button>
    </form>

    <div id="result" class="mt-6 text-center hidden">
      <p class="text-gray-700 text-sm mb-2">Your License Key:</p>
      <div class="text-xl font-mono font-semibold text-green-600 bg-gray-100 px-4 py-2 rounded-lg inline-block" id="licenseKey"></div>
    </div>
  </div>

  <script>
    function generateLicenseKey(name, email) {
      const salt = 'WASEEMUXUI2025';
      const data = (name + email + salt).toUpperCase();
      const hash = Array.from(new TextEncoder().encode(data))
        .reduce((acc, val) => acc + val.toString(16), '');
      const key = hash.slice(0, 16).toUpperCase().match(/.{1,4}/g).join('-');
      return key;
    }

    document.getElementById('licenseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const key = generateLicenseKey(name, email);
      document.getElementById('licenseKey').textContent = key;
      document.getElementById('result').classList.remove('hidden');
    });
  </script>
</body>
</html>
